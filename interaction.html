<!doctype html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Afficher et masquer des détails</title>
    <link rel="stylesheet" href="./dist/output.css">
</head>
<body class="bg-slate-100 p-6 text-slate-900">
    <main class="mx-auto max-w-md rounded-xl bg-white p-10 shadow-md">
        <h1 class="text-2xl font-bold">Afficher et masquer des détails</h1>

        <button id="details-button" type="button"
            aria-expanded="false" aria-controls="details"
            class="mt-6 rounded-lg bg-blue-700 px-4 py-2 font-semibold text-white hover:bg-blue-800 focus-visible:outline-2 focus-visible:outline-offset-4 focus-visible:outline-blue-700">
            Voir les conditions
        </button>
        <div id="details" class="mt-4 rounded-lg bg-blue-50 p-4 hidden">
            <p>Livraison offerte dès 50 €, retour gratuit sous 30 jours.</p>
        </div>

        <button id="details-button-2" type="button"
            aria-expanded="false" aria-controls="details-2"
            class="mt-6 rounded-lg bg-blue-700 px-4 py-2 font-semibold text-white hover:bg-blue-800 focus-visible:outline-2 focus-visible:outline-offset-4 focus-visible:outline-blue-700">
            Voir les horaires
        </button>
        <div id="details-2" class="mt-4 rounded-lg bg-blue-50 p-4 hidden">
            <p>Ouvert du lundi au samedi, de 9 h à 19 h.</p>
        </div>

        <script src="./interaction.js" defer></script>
    </main>
</body>
</html>
